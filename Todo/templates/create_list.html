{% extends "base.html" %}
{% block title %} Home - Create A List {% endblock %}
{% block content %}
<main class="container py-5 pt-5 mt-5">
        <div class="card shadow-sm">
            <div class="card-body">
                {% if list_length == 0 %}
                    <p class="lead text-muted text-center mb-0">
                        List is empty. Add Items!!
                    </p>
                {% else %}
                    {% for item in todo_list %}
                            <ul class="list-group">
                                <li class="list-group-item">
                                        {% if item.status %}
                                            <div class="d-flex align-items-center gap-2">
                                                <label class="m-0">
                                                    <span class="fs-5 text-secondary task-done">{{item.list_item}}</span>
                                                </label>
                                                <form action="{{ url_for('main.task_undone') }}" method="post">
                                                    <input type="hidden" value="create" name="return_to">
                                                    <input type="hidden" value="{{ item.list_items_id }}" name="task_id">
                                                    <input type="hidden" value="{{ item.list_id }}" name="list_id">                                      
                                                    <button type="submit" class="btn btn-outline-warning">↶</button>
                                                </form>
                                                <form action="{{ url_for('main.task_remove') }}" method="post">
                                                        <input type="hidden" value="create" name="return_to">
                                                        <input type="hidden" value="{{ item.list_items_id }}" name="task_id">
                                                        <input type="hidden" value="{{ item.list_id }}" name="list_id">
                                                       <button type="submit" class="btn btn-danger">🗑️</button>
                                                </form>
                                            </div>
                                        {% else %}
                                            <div class="d-flex align-items-center gap-2">
                                                <label class="m-0">
                                                    <span class="fs-5 text-secondary">{{item.list_item}}</span>
                                                </label>
                                                 <form action="{{ url_for('main.task_done') }}" method="post">
                                                    <input type="hidden" value="create" name="return_to">
                                                    <input type="hidden" value="{{ item.list_items_id }}" name="task_id">
                                                    <input type="hidden" value="{{ item.list_id }}" name="list_id">
                                                    <button type="submit" class="btn btn-success">✔</button>
                                                 </form>
                                                <form action="{{ url_for('main.task_remove') }}" method="post">
                                                        <input type="hidden" value="create" name="return_to">
                                                        <input type="hidden" value="{{ item.list_items_id }}" name="task_id">
                                                        <input type="hidden" value="{{ item.list_id }}" name="list_id">
                                                       <button type="submit" class="btn btn-danger">🗑️</button>
                                                </form>
                                             </div>
                                        {% endif %}
                                    <br>
                                </li>
                            </ul>
                    {% endfor %}
                {% endif %}
                <br>
                <br>
            </div>
        </div>
        <form action="{{url_for('main.add')}}" method="post" class="mt-4 d-flex gap-2">
            <label for="item" id="item">
                <input type="hidden" value="create" name="return_to">
                <input type="text" class="form-control border-primary shadow-sm" placeholder="Task" name="task">
                <input type="hidden" value="{{ list_id }}" name="list_id">
            </label>
            <button type="submit" class="btn btn-outline-primary"> Add </button>
        </form>
        <br>
        <br>
    <form action="{{ url_for('main.save') }}" method="post">
        <label for="title" id="title">
            <input type="hidden" value="create" name="return_to">
            <input type="hidden" name="list_id" value="{{ list_id }}">
            <input type="text" name="title" class="border border-primary-subtle" placeholder="Title">
        </label>
        <br>
        <br>
        <button type="submit" class="btn btn-outline-secondary">Save</button>
    </form>
</main>
{% endblock %}
